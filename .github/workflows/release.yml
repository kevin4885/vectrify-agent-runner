name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build all platforms
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          # Windows: NO "-s -w". Stripping symbols from an unsigned Go exe makes
          # it look opaque to Microsoft Defender's ML classifier
          # (Trojan:Win32/Bearfoos.A!ml false positive). Other OSes stay stripped.
          # -trimpath removes the CI runner's absolute paths from every binary.
          LDFLAGS_WIN="-X vectrify/agent-runner/config.Version=${VERSION}"
          LDFLAGS="-s -w -X vectrify/agent-runner/config.Version=${VERSION}"

          # Windows version-info + manifest resource. The _windows_amd64 suffix
          # on the .syso means only the Windows build links it.
          IFS=. read -r VMAJ VMIN VPAT _ <<< "${VERSION%%[-+]*}"
          VMAJ=${VMAJ:-0}; VMIN=${VMIN:-0}; VPAT=${VPAT:-0}
          # A non-numeric tag (e.g. "vtest") must not fail the release build.
          [[ $VMAJ =~ ^[0-9]+$ ]] || VMAJ=0
          [[ $VMIN =~ ^[0-9]+$ ]] || VMIN=0
          [[ $VPAT =~ ^[0-9]+$ ]] || VPAT=0
          VFULL="${VMAJ}.${VMIN}.${VPAT}.0"
          go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.4.1 -64 \
            -o resource_windows_amd64.syso \
            -file-version "$VFULL" -product-version "$VFULL" \
            -ver-major "$VMAJ" -ver-minor "$VMIN" -ver-patch "$VPAT" -ver-build 0 \
            -product-ver-major "$VMAJ" -product-ver-minor "$VMIN" -product-ver-patch "$VPAT" -product-ver-build 0 \
            winres/versioninfo.json

          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS_WIN" -o dist/vectrify-runner-windows-amd64.exe .
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/vectrify-runner-linux-amd64 .
          GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o dist/vectrify-runner-linux-arm64 .
          GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/vectrify-runner-darwin-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o dist/vectrify-runner-darwin-arm64 .

      - name: Generate checksums
        # Required by updater/apply_windows.go and apply_other.go: the
        # auto-updater now REFUSES to install a release that has no
        # checksums.txt (previously it warned and proceeded unverified —
        # see the commit that added this step for why that's not
        # acceptable). Every release from here on must include this file
        # so installed runners can keep auto-updating.
        run: |
          cd dist
          sha256sum vectrify-runner-windows-amd64.exe \
                     vectrify-runner-linux-amd64 \
                     vectrify-runner-linux-arm64 \
                     vectrify-runner-darwin-amd64 \
                     vectrify-runner-darwin-arm64 > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: |
            dist/vectrify-runner-windows-amd64.exe
            dist/vectrify-runner-linux-amd64
            dist/vectrify-runner-linux-arm64
            dist/vectrify-runner-darwin-amd64
            dist/vectrify-runner-darwin-arm64
            dist/checksums.txt
            install.sh
            install.ps1
